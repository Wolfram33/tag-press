<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <!-- Tag-Press Hero: Abstrakte Darstellung eines modularen Websystems -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3b5c"/>
      <stop offset="1" stop-color="#1e4d26"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Zonen als Rahmen -->
  <g fill="none" stroke="#a8d5f2" stroke-width="3" opacity="0.9">
    <rect x="80"  y="60"  width="300" height="120" rx="12"/>
    <rect x="80"  y="220" width="300" height="120" rx="12"/>
    <rect x="450" y="120" width="300" height="160" rx="12"/>
    <rect x="820" y="60"  width="300" height="120" rx="12"/>
    <rect x="820" y="220" width="300" height="120" rx="12"/>
  </g>

  <!-- Verbindungen zwischen den Zonen -->
  <g stroke="#7fd08a" stroke-width="3" opacity="0.8">
    <line x1="380" y1="120" x2="450" y2="180"/>
    <line x1="380" y1="280" x2="450" y2="220"/>
    <line x1="750" y1="180" x2="820" y2="120"/>
    <line x1="750" y1="220" x2="820" y2="280"/>
  </g>

  <!-- Objekte als gefüllte Formen -->
  <g fill="#f0a860">
    <circle cx="130" cy="120" r="16"/>
    <circle cx="180" cy="120" r="16"/>
    <circle cx="130" cy="280" r="16"/>
    <circle cx="600" cy="200" r="22"/>
    <circle cx="870" cy="120" r="16"/>
    <circle cx="870" cy="280" r="16"/>
  </g>
  <g fill="#a8d5f2" opacity="0.9">
    <rect x="220" y="105" width="120" height="12" rx="6"/>
    <rect x="220" y="127" width="90"  height="12" rx="6"/>
    <rect x="170" y="265" width="170" height="12" rx="6"/>
    <rect x="170" y="287" width="130" height="12" rx="6"/>
    <rect x="640" y="185" width="80"  height="12" rx="6"/>
    <rect x="640" y="207" width="60"  height="12" rx="6"/>
    <rect x="910" y="105" width="170" height="12" rx="6"/>
    <rect x="910" y="265" width="140" height="12" rx="6"/>
    <rect x="910" y="287" width="100" height="12" rx="6"/>
  </g>
</svg>
